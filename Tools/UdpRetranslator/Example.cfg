// all symbols after // treats as comment and not parse

// to list all available capture devices run:   UdpRtr.exe -devlist
// to test capturing on device run:             UdpRtr.exe -testcap

captureFrom = Realtek Gaming GbE Family Controller	// capturing device selection

// Format of retranslation rules for selected device:
//
// sourceIP[:port] -> destinationIP[:port] => retranslated_sourceIP[:port] -> retranslated destinationIP[:port]
//
// If in source IP or destination IP port isn't specified - packets from any ports to
// any ports will be retranslated
//
// If in retranslated source IP or destination IP port isn't specified - ports from
// original packet will be used
//

192.168.11.61       -> 192.168.11.254       => 192.168.112.61       -> 192.168.112.250
192.168.11.62:53225 -> 192.168.11.254:13322 => 192.168.112.62:33225 -> 192.168.112.250:33322

// ------------------------------------------------------------------------------------------

captureFrom = Another Controller			// another capturing device selection

// retranslation rules for Another Controller

192.168.21.61       -> 192.168.21.254       => 192.168.121.61       -> 192.168.121.250
