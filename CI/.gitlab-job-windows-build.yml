#Request documents from SVN
    - "# ----------------------------------------------"
    - "#               Request documents from SVN"
    - "# ----------------------------------------------"
    - "pushd ."	
    - "cd $Env:CI_PROJECT_DIR/doc"
    - "&./SvnGetDocs.bat"
    - "popd"

#Build Installer
    - "# ----------------------------------------------"
    - "#               Build Installer"
    - "# ----------------------------------------------"
    - "cmake --build ./build --target create_install"	
#    - "&$SIGNTOOL sign /v /a  /tr http://timestamp.digicert.com /fd SHA256 /f c:\\radiy-code-signing\\radiy-code-signing.pfx /p $SIGN_PASSWORD $Env:BIN_OUT_DIR\\..\\*.exe"

  artifacts:
    name: "u7set-win-x64-${CI_MAJOR_VERSION}.${CI_MINOR_VERSION}.${CI_PATCH_VERSION}-p${CI_PIPELINE_ID}-${CI_RELEASE_TYPE}-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - bin/*.exe
      - bin/*.exe
      - bin/release/*.exe
      - bin/release/*.dll
      - bin/release/iconengines/*.dll
      - bin/release/imageformats/*.dll
      - bin/release/networkinformation/*.dll
      - bin/release/platforms/*.dll
      - bin/release/sqldrivers/*.dll
      - bin/release/styles/*.dll
      - bin/release/tls/*.dll
      - bin/release/translations/*.qm
      - bin/release/scripting/*.*
      - bin/release/scripthelp/*.*
      - bin/release/scripthelp/search/*.*
      - bin/release/docs/*.pdf
      - bin/release/docs/*.md
      - bin/release/docs/Appendixes/*.pdf
      - bin/release/ftdi/**/*
      - bin/release/license/**/*
