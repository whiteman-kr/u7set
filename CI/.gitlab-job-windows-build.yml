windows_build_job:
  stage: build
  needs: ["project_backup_job"]
  only:
    - master
    - /^release.*$/
    - develop
    - /experimental/
    - /^.*exp.*$/
    - /^.*rpct-.*$/
    - /^.*RPCT-.*$/
  tags:
    - vs2017
  before_script:
    - $Env:VCPKG_ROOT="C:/data/vcpkg/vcpkg"
    - $Env:VCPKG_DEFAULT_BINARY_CACHE="C:/data/vcpkg/cache_windows_build"
    - $env:Path += ";C:/data/vcpkg/vcpkg"
  script:
    - "dir env:"
    - "echo $Env:CI_COMMIT_SHA"
    - "git status"
    - "git log -1"
    - $Env:QT_BIN_DIR="C:\\Qt\\${Env:QT_VERSION}\\msvc2022_64"
    - $Env:BIN_OUT_DIR="$Env:CI_PROJECT_DIR\bin\release"
    - $Env:INSTALL_OUT_DIR="$Env:CI_PROJECT_DIR\\dev"
#Build Project
    - "# ----------------------------------------------"
    - "#               Build Project"
    - "# ----------------------------------------------"    
    - "& './gitlab_ci_build_licenser.bat'"
    - "& './gitlab_ci_build.bat'"
#Copy Qt DLLs to bin/release
    - "# ----------------------------------------------"
    - "#               Copy Qt DLL's"
    - "# ----------------------------------------------"
    - "& './CI/windeploy.bat'"
#Copy FTDI Drivers to release
    - "mkdir \"$Env:BIN_OUT_DIR/ftdi\""
    - "copy C:\\ftdi\\CDM-v2.12.36.4-WHQL-Certified.zip $Env:BIN_OUT_DIR\\ftdi\\"
# Copy documents
    - "mkdir \"$Env:BIN_OUT_DIR/docs\""
    - "copy $Env:CI_PROJECT_DIR\\Metrology\\docs\\Metrology_User_Manual.pdf $Env:BIN_OUT_DIR\\docs\\"
    - "copy $Env:CI_PROJECT_DIR\\doc\\AdsGatewayProtocolSpec.md $Env:BIN_OUT_DIR\\docs\\"
    - "copy $Env:CI_PROJECT_DIR\\doc\\VduScriptApi.md $Env:BIN_OUT_DIR\\docs\\"
# Copy GlobalScript library
    - "mkdir \"$Env:BIN_OUT_DIR/scripting\""
    - "copy $Env:CI_PROJECT_DIR\\Scripts\\GlobalScript\\*.* $Env:BIN_OUT_DIR\\scripting\\"

#Remove some files not requiered for releases
    - "# ----------------------------------------------"
    - "#               Remove some files not requiered for releases"
    - "# ----------------------------------------------"
    - "del -Force $Env:BIN_OUT_DIR/DiagDataSrv.exe"

