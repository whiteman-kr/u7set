ai_code_review:
  stage: prepare
  needs: []
  allow_failure: true
  
  variables:
    GIT_DEPTH: "0" # Fetch full git history to ensure commit diffs work
    OLLAMA_URL: "http://127.0.0.1:11434"
    OLLAMA_MODEL: "qwen2.5-coder:32b"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always

  tags:
    - projectbackup

  script:
    - python --version
    - python -m pip install --disable-pip-version-check -r CI/AiCodeReview/requirements.txt
    - python CI/AiCodeReview/ai_review.py