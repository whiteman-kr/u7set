    - "copy $Env:CI_PROJECT_DIR\\Metrology\\docs\\Metrology_User_Manual.pdf \"$Env:CI_PROJECT_DIR/bin/release/docs/\""
# Copy GlobalScript library
    - "mkdir \"$Env:CI_PROJECT_DIR/bin/release/scripting\""
    - "copy $Env:CI_PROJECT_DIR\\Scripts\\GlobalScript\\*.* \"$Env:CI_PROJECT_DIR/bin/release/scripting/\""

#Remove some files not requiered for releases
    - "# ----------------------------------------------"
    - "#               Remove some files not requiered for releases"
    - "# ----------------------------------------------"
    - "del -Force $Env:CI_PROJECT_DIR/bin/release/DiagDataSrv.exe"
    
