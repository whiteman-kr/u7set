variables:
  GIT_DEPTH: "1"

  # Version. Set to the desired release type "Default" or "Stable"
  #
  CI_RELEASE_TYPE: "Default"    # Set to the desired release type "Default" or "Stable"
  CI_MAJOR_VERSION: "11"        # Odd is for development, even is for release
  CI_MINOR_VERSION: "0"
  CI_PATCH_VERSION: "0"         # Path version for Default release is ignored and set to pipeline id.

  # Build and test data
  #
  QT_VERSION: "6.8.1"
  COMPILER_TESTS_PROJECT_NAME: "compiler_tests_v425"
  SIMULATOR_PROJECT_NAME: "test_simulator_v425"
  PGPASSWORD: "P2ssw0rd"

  CTEST_OUTPUT_ON_FAILURE: "1"

stages:
  - prepare
  - build
  - test

before_script:
#  - echo before_script
  - cd
  - dir
  
#after_script:
#  - echo after_script
project_backup_job:
  stage: prepare
  variables:
    GIT_STRATEGY: none
  only:
    - master
    - /^release.*$/
    - develop
    - /experimental/
    - /^.*exp.*$/
    - /^.*rpct-.*$/
    - /^.*RPCT-.*$/
  tags:
    - projectbackup
  script:
    - "# ----------------------------------------------"
    - "#               Create backup of database files "
    - "# ----------------------------------------------"
    - "if (Test-Path \"f:\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1\") {  Remove-Item -Verbose -Force \"f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1\" }"
    - "if (Test-Path \"f:\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1\") {  Remove-Item -Verbose -Force \"f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1\" }"
    - "pg_dump -h 192.168.75.10 -U u7 -f f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1 u7_${Env:COMPILER_TESTS_PROJECT_NAME}"
    - "pg_dump -h 192.168.75.10 -U u7 -f f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1 u7_${Env:SIMULATOR_PROJECT_NAME}"
    - "f:\\TestDatabase\\UpdateFileIfDifferent.ps1 f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1 f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql"
    - "f:\\TestDatabase\\UpdateFileIfDifferent.ps1 f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1 f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql"


linux_build_job:
  stage: build
  needs: ["project_backup_job"]
  only:
    - master
    - /^release.*$/
    - develop
    - /experimental/
    - /^.*exp.*$/
    - /^.*rpct-.*$/
    - /^.*RPCT-.*$/
  tags:
    - gcc
  before_script:
    - export PATH="/home/gitlab-runner/vcpkg:$PATH"
    - export VCPKG_ROOT="/home/gitlab-runner/vcpkg"
  script:
    - "printenv"
    - "pwd"
    - "whoami"
    - "gcc --version"
    - "echo $CI_COMMIT_SHA"
    - "cd $CI_PROJECT_DIR"
    - "git status"
    - "git log -1"

#Build Project
    - "# ----------------------------------------------"
    - "#               Build Project"
    - "# ----------------------------------------------"    
    - "cmake -S . -B ./build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/Qt/${QT_VERSION}/gcc_64 -DBIN_OUT_DIR=$CI_PROJECT_DIR/bin/release"
    - "cmake --build ./build"

  artifacts:
    name: "u7set-linux-x64-${CI_MAJOR_VERSION}.${CI_MINOR_VERSION}.${CI_PATCH_VERSION}-p${CI_PIPELINE_ID}-${CI_RELEASE_TYPE}-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - bin/release/*
    exclude:
      - bin/release/**/*.a
#

