variables:
  GIT_DEPTH: "1"
  QT_VERSION: "6.3.2"
  COMPILER_TESTS_PROJECT_NAME: "compiler_tests_v381"
  SIMULATOR_PROJECT_NAME: "test_simulator_v381"
  
stages:
  - build
  - test
#  - deploy

before_script:
#  - echo before_script
  - cd
  - dir
  
#after_script:
#  - echo after_script


linux_build_job:
  stage: build
  only:
    - master
    - /^release.*$/
    - develop
    - /experimental/
    - /^.*exp.*$/
    - /^.*rpct-.*$/
    - /^.*RPCT-.*$/
  tags:
    - gcc
  script:
    - "printenv"
    - "pwd"
    - "whoami"
    - "gcc --version"
    - "echo $CI_COMMIT_SHA"
    - "cd $CI_PROJECT_DIR"
    - "git status"
    - "git log -1"
#generation version file
    - "echo '#pragma once' > gitlabci_version.h"
    - "echo >> gitlabci_version.h"
    - "echo '#define GITLAB_CI_BUILD' >> gitlabci_version.h"
    - echo '#define CI_BUILD_REF_SLUG' \"$CI_BUILD_REF_SLUG\" >> gitlabci_version.h
    - echo '#define CI_COMMIT_SHA' \"$CI_COMMIT_SHA\" >> gitlabci_version.h
    - echo '#define GITLAB_USER_NAME' \"$GITLAB_USER_NAME\" >> gitlabci_version.h
    - echo '#define CI_PIPELINE_ID' $CI_PIPELINE_ID >> gitlabci_version.h
    - echo '#define COMPUTERNAME' \"$HOSTNAME\" >> gitlabci_version.h
    - echo '#define BUILD_DATE' \"$(date)\" >> gitlabci_version.h

#Build Project
    - "# ----------------------------------------------"
    - "#               Build Project"
    - "# ----------------------------------------------"    
    - "/opt/Qt/${QT_VERSION}/gcc_64/bin/qmake u7set.pro -spec linux-g++"
    - "make -j12"

  artifacts:
    name: "u7set_linux_0.9.$CI_PIPELINE_ID $CI_BUILD_REF_SLUG $CI_COMMIT_SHA"
    paths:
      - bin_unix/*
    exclude:
      - bin_unix/**/*.a
