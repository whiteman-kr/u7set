variables:
  GIT_DEPTH: "1"
  QT_VERSION: "6.5.1"
  COMPILER_TESTS_PROJECT_NAME: "compiler_tests_v389"
  SIMULATOR_PROJECT_NAME: "test_simulator_v387"
  PGPASSWORD: "P2ssw0rd"
  
stages:
  - prepare
  - build
  - test
#  - deploy

before_script:
#  - echo before_script
  - cd
  - dir
  
#after_script:
#  - echo after_script
project_backup_job:
  stage: prepare
  variables:
    GIT_STRATEGY: none
  only:
    - master
    - /^release.*$/
    - develop
    - /experimental/
    - /^.*exp.*$/
    - /^.*rpct-.*$/
    - /^.*RPCT-.*$/
  tags:
    - projectbackup
  script:
    - "# ----------------------------------------------"
    - "#               Create backup of database files "
    - "# ----------------------------------------------"
    - "if (Test-Path \"f:\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1\") {  Remove-Item -Verbose -Force \"f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1\" }"
    - "if (Test-Path \"f:\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1\") {  Remove-Item -Verbose -Force \"f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1\" }"
    - "pg_dump -h 192.168.75.10 -U u7 -f f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1 u7_${Env:COMPILER_TESTS_PROJECT_NAME}"
    - "pg_dump -h 192.168.75.10 -U u7 -f f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1 u7_${Env:SIMULATOR_PROJECT_NAME}"
    - "f:\\TestDatabase\\UpdateFileIfDifferent.ps1 f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql.1 f:\\TestDatabase\\u7_${Env:COMPILER_TESTS_PROJECT_NAME}.sql"
    - "f:\\TestDatabase\\UpdateFileIfDifferent.ps1 f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql.1 f:\\TestDatabase\\u7_${Env:SIMULATOR_PROJECT_NAME}.sql"


linux_build_job:
  stage: build
  needs: ["project_backup_job"]
  only:
    - master
    - /^release.*$/
    - develop
    - /experimental/
    - /^.*exp.*$/
    - /^.*rpct-.*$/
    - /^.*RPCT-.*$/
  tags:
    - gcc
  script:
    - "printenv"
    - "pwd"
    - "whoami"
    - "gcc --version"
    - "echo $CI_COMMIT_SHA"
    - "cd $CI_PROJECT_DIR"
    - "git status"
    - "git log -1"
#generation version file
    - "echo '#pragma once' > gitlabci_version.h"
    - "echo >> gitlabci_version.h"
    - "echo '#define GITLAB_CI_BUILD' >> gitlabci_version.h"
    - echo '#define CI_COMMIT_REF_SLUG' \"$CI_COMMIT_REF_SLUG\" >> gitlabci_version.h
    - echo '#define CI_COMMIT_SHA' \"$CI_COMMIT_SHA\" >> gitlabci_version.h
    - echo '#define GITLAB_USER_NAME' \"$GITLAB_USER_NAME\" >> gitlabci_version.h
    - echo '#define CI_PIPELINE_ID' $CI_PIPELINE_ID >> gitlabci_version.h
    - echo '#define COMPUTERNAME' \"$HOSTNAME\" >> gitlabci_version.h
    - echo '#define BUILD_DATE' \"$(date)\" >> gitlabci_version.h

#Build Project
    - "# ----------------------------------------------"
    - "#               Build Project"
    - "# ----------------------------------------------"    
    - "cmake -S . -B ./build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/Qt/${QT_VERSION}/gcc_64 -DBIN_OUT_DIR=$CI_PROJECT_DIR/bin/release"
    - "cmake --build ./build"

  artifacts:
    name: "u7set_linux_0.9.$CI_PIPELINE_ID $CI_COMMIT_REF_SLUG $CI_COMMIT_SHA"
    paths:
      - bin/release/*
    exclude:
      - bin/release/**/*.a
#

