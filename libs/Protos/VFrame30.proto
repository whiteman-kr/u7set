message TrendIndicatorSchemaItems
{
	optional Uuid itemUuid = 2;
	optional int32 samplePeriod = 3;		// Enum E::RtTrendsSamplePeriod
	optional int32 timeType = 4;		// Enum E::TimeType
	optional int32 durationSeconds = 5;
